name: Fix auth syntax
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(type.includes('application/json')){try{return await r.json()}catch{return {error:'O servidor retornou uma resposta inválida.'}}const text=await r.text();"
          new="if(type.includes('application/json')){try{return await r.json()}catch{return {error:'O servidor retornou uma resposta inválida.'}}}const text=await r.text();"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/fix-auth-syntax.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html .github/workflows/fix-auth-syntax.yml
          git commit -m "fix: corrige JavaScript que bloqueava o login"
          git push
