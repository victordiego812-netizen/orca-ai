name: Corrigir sintaxe do login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: corrige sintaxe do login'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Corrigir JavaScript e remover workflow temporário
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(type.includes('application/json')){try{return await r.json()}catch{return {error:'O servidor retornou uma resposta inválida.'}}const text=await r.text();"
          new = "if(type.includes('application/json')){try{return await r.json()}catch{return {error:'O servidor retornou uma resposta inválida.'}}}const text=await r.text();"
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-auth-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-auth-syntax.yml
          git commit -m "fix: restaura login após tratamento de erro"
          git push
